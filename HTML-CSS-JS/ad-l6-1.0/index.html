<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
  
  <div class="container-sm">

    <button type="button" class="btn btn-secundary">Primary</button>
    <button type="button" class="btn btn-secundary">Primary</button>
    <button type="button" class="btn btn-secundary">Primary</button>

    <p class="text-start">Start aligned text on all viewport sizes.</p>
    <p class="text-center" style="color: red;">Center aligned text on all viewport sizes.</p>
    <p class="text-end">End aligned text on all viewport sizes.</p> 

    <div class="card" style="width: 18rem;">
      <header style="text-align: center;">Hoja de ruta</header>
      <img src="./Frutascanasta.webp" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">Comprar frutas</h5>
        <ul>
          <li>Manzana</li>
          <li>Mango</li>
          <li>Fresas</li>
        </ul>
        <a href="#" class="btn btn-primary">Comprar</a>
      </div>
    </div>

    <div class="card" style="width: 18rem;">
      <img src="./Gatos.webp" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">Adopta un gato</h5>
        <p class="card-text">El 100% de los gatos vienen con muchos beneficios para la salud.</p>
        <a href="#" class="btn btn-primary">Adoptar</a>
      </div>
    </div>

  </div>

  
  
  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->
  <script src="script.js"></script>
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>

</html>
